<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队联系人</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f6f8; color: #182333; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 980px; margin: 48px auto; padding: 24px; }
  h1 { margin-bottom: 4px; }
  p { color: #586476; }
  .panel { background: white; border: 1px solid #dde2e8; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 16px; border-bottom: 1px solid #e8ebef; }
  th { font-weight: 600; background: #f9fafb; }
  tr:last-child td { border-bottom: 0; }
  caption { text-align: left; padding: 16px; font-weight: 600; }
</style>
<main>
  <h1>团队联系人</h1>
  <p>把常用联系信息放在一起，方便查找。</p>
  <div class="panel">
    <table><caption id="count"></caption><thead><tr><th>姓名</th><th>邮箱</th><th>公司</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</main>
<script>
  const contacts = [
    { name: '陈宁', email: 'chen.ning@example.test', company: '山海工作室' },
    { name: '林安', email: 'lin.an@example.test', company: '青禾设计' },
    { name: 'Alex Lee', email: 'alex.lee@example.test', company: 'North Lab' },
  ];
  function renderContacts() {
    document.getElementById('rows').replaceChildren();
    for (const contact of contacts) {
      const row = document.createElement('tr');
      for (const field of ['name', 'email', 'company']) {
        const cell = document.createElement('td');
        cell.textContent = contact[field];
        row.append(cell);
      }
      document.getElementById('rows').append(row);
    }
    document.getElementById('count').textContent = `${contacts.length} 位联系人`;
  }
  renderContacts();
</script>
</html>
