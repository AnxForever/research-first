<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>稍后阅读</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #1d2939; background: #f4f6f8; }
    body { margin: 0; }
    main { max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    p { color: #566273; }
    form, li { background: white; border: 1px solid #d9dee6; border-radius: .75rem; padding: 1rem; }
    form { display: grid; gap: .75rem; margin: 1.5rem 0; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    input { font: inherit; padding: .55rem; border: 1px solid #aab4c2; border-radius: .35rem; }
    button { width: fit-content; padding: .55rem .9rem; font: inherit; cursor: pointer; }
    ul { display: grid; gap: .75rem; padding: 0; list-style: none; }
    li p { margin: .4rem 0 0; white-space: pre-wrap; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>稍后阅读</h1>
    <p>把想读的网页留在这里。</p>
    <form id="add-form">
      <label>标题 <input name="title" required></label>
      <label>网址 <input name="url" type="url" required></label>
      <label>备注 <input name="note"></label>
      <button type="submit">添加链接</button>
    </form>
    <div class="actions"><button id="clear-list" type="button">清空列表</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="items"></ul>
  </main>
  <script src="./app.js"></script>
</body>
</html>
