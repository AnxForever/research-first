name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation and optional Jev SDK dependencies
        run: python -m pip install -r scripts/requirements-dev.txt -r scripts/requirements-jev.txt
      - name: Validate distributable package
        run: python scripts/validate_package.py
      - name: Verify test dependencies are installed
        run: python -c "import yaml; import typesafe_sdk"
      - name: Run unit and SDK contract tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py" --verbose
